<!-- q8.html -->
<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Q8 - Dynamic Blog Posts</title>
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="q8.js"></script>
        <style>
    .post { padding:10px; border:1px solid #ddd; margin-bottom:8px; }
    .featured { border-color: #f39c12; }
    .tag { font-size:0.85rem; color:#666; margin-right:6px; }
    .highlight { background: #fff8e6; }
  </style>
    </head>
    <body>
        <main>
            <h1>Blog Admin (Q8)</h1>

            <div>
                <input id="postTitle" placeholder="Post title" />
                <input id="postContent" placeholder="Short content" />
                <button id="addPost">Add New Post</button>
                <button id="prependFeatured">Prepend Featured Post</button>
                <button id="removeLast">Remove Last Post</button>
            </div>

            <section id="posts">
                <article class="post">Welcome to our blog!</article>
                <article class="post">Getting started with JS</article>
                <article class="post">Advanced CSS techniques</article>
                <article class="post">Accessibility basics</article>
                <article class="post">Performance tuning tips</article>
            </section>
        </main>
    </body>
</html>
