<!-- q10.html -->
<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Q10 - Registration Validation</title>
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="q10.js"></script>
        <style>
    body { font-family: Arial, sans-serif; padding:20px; }
    form { max-width:420px; }
    .field { margin-bottom:10px; }
    .invalid { border:2px solid #d9534f; }
    .success { color: green; }
    .errorMsg { color:#d9534f; font-size:0.9rem; display:none; }
  </style>
    </head>
    <body>
        <main>
            <h1>Register (Q10)</h1>
            <form id="regForm" novalidate>
                <div class="field">
                    <label for="name">Name</label><br />
                    <input id="name" name="name" type="text" />
                    <div class="errorMsg" id="nameError">Name cannot be
                        empty.</div>
                </div>

                <div class="field">
                    <label for="email">Email</label><br />
                    <input id="email" name="email" type="email" />
                    <div class="errorMsg" id="emailError">Enter a valid unique
                        email.</div>
                </div>

                <div class="field">
                    <label for="password">Password</label><br />
                    <input id="password" name="password" type="password" />
                    <div class="errorMsg" id="passError">Password must be at
                        least 8 characters.</div>
                </div>

                <button type="submit">Register</button>
            </form>

            <div id="result" role="status"></div>
        </main>
    </body>
</html>
